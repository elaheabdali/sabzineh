name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Playwright E2E lands in Week 2 (catalog flows) — the e2e job is added
  # then, on Chromium + Firefox. Week 1 CI is typecheck/lint/test/build.
